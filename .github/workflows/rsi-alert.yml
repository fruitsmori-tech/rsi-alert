name: RSI/BB Alert

on:
  schedule:
    # GitHub cron can be delayed by minutes to hours. Each report slot is scheduled several
    # times at off-minutes; the first run to start sends, later ones skip (see "Skip if already sent").
    # JP midday report (deadline 11:45 JST): 11:33 / 11:39 JST (Mon-Fri)
    - cron: "33 2 * * 1-5"
    - cron: "39 2 * * 1-5"
    # JP post-close report (deadline 17:00 JST): 15:41 / 15:57 / 16:13 / 16:29 JST (Mon-Fri)
    - cron: "41 6 * * 1-5"
    - cron: "57 6 * * 1-5"
    - cron: "13 7 * * 1-5"
    - cron: "29 7 * * 1-5"
    # US market check (deadline 07:00 JST): 06:17 / 06:33 / 06:49 JST Tue-Sat (UTC Mon-Fri)
    - cron: "17 21 * * 1-5"
    - cron: "33 21 * * 1-5"
    - cron: "49 21 * * 1-5"
    # BTC/ETH only (deadline 07:00 JST): 06:17 / 06:33 / 06:49 JST Sun/Mon (UTC Sat/Sun)
    - cron: "17 21 * * 0,6"
    - cron: "33 21 * * 0,6"
    - cron: "49 21 * * 0,6"
  workflow_dispatch:
    inputs:
      market:
        description: "Market to check (jp, us or crypto)"
        required: true
        default: "jp"
        type: choice
        options:
          - jp
          - us
          - crypto
      midday:
        description: "Run the JP midday BB-only check"
        required: false
        default: false
        type: boolean
      auto:
        description: "Called by the external timer: dedupe with the scheduled backup runs"
        required: false
        default: false
        type: boolean

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine market
        id: market
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MARKET: ${{ inputs.market }}
          INPUT_MIDDAY: ${{ inputs.midday }}
        run: |
          market=us
          extra=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            market="$INPUT_MARKET"
            [ "$INPUT_MIDDAY" = "true" ] && extra="--midday"
          else
            case "$SCHEDULE" in
              "33 2 * * 1-5"|"39 2 * * 1-5") market=jp; extra="--midday" ;;
              "41 6 * * 1-5"|"57 6 * * 1-5"|"13 7 * * 1-5"|"29 7 * * 1-5") market=jp ;;
              *"* * 0,6") market=crypto ;;
              *) market=us ;;
            esac
          fi
          echo "market=$market" >> "$GITHUB_OUTPUT"
          echo "extra_args=$extra" >> "$GITHUB_OUTPUT"
          # One marker per report slot per JST day; manual runs (auto=false) are never deduplicated.
          slot="sent-$market${extra:+-midday}-$(TZ=Asia/Tokyo date +%F)"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          mkdir -p .sent && echo "$slot" > .sent/marker

      - name: Skip if already sent
        id: dedup
        if: github.event_name == 'schedule' || inputs.auto
        uses: actions/cache@v4
        with:
          path: .sent
          key: ${{ steps.market.outputs.slot }}

      - uses: actions/setup-python@v5
        if: steps.dedup.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      - name: Install Japanese font
        if: steps.dedup.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y fonts-ipafont-gothic

      - name: Install dependencies
        if: steps.dedup.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Run check
        if: steps.dedup.outputs.cache-hit != 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python rsi_alert.py --market ${{ steps.market.outputs.market }} ${{ steps.market.outputs.extra_args }}

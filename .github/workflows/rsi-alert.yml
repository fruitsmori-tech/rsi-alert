name: RSI/BB Alert

on:
  schedule:
    # 02:35 UTC = 11:35 JST (Mon-Fri only) — JP midday report (deadline 11:45 JST; off-minute to reduce GitHub cron delay)
    - cron: "35 2 * * 1-5"
    # 06:43 UTC = 15:43 JST (Mon-Fri only) — JP post-close report (deadline 17:00 JST)
    - cron: "43 6 * * 1-5"
    # 21:17 UTC Mon-Fri = 06:17 JST Tue-Sat — US market check (deadline 07:00 JST; last send: Sat morning)
    - cron: "17 21 * * 1-5"
    # 21:17 UTC Sat/Sun = 06:17 JST Sun/Mon — BTC/ETH only (no US/JP markets open)
    - cron: "17 21 * * 0,6"
  workflow_dispatch:
    inputs:
      market:
        description: "Market to check (jp, us or crypto)"
        required: true
        default: "jp"
        type: choice
        options:
          - jp
          - us
          - crypto
      midday:
        description: "Run the JP midday BB-only check"
        required: false
        default: false
        type: boolean

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese font
        run: sudo apt-get update && sudo apt-get install -y fonts-ipafont-gothic

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine market
        id: market
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "market=${{ inputs.market }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.midday }}" = "true" ]; then
              echo "extra_args=--midday" >> "$GITHUB_OUTPUT"
            else
              echo "extra_args=" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event.schedule }}" = "35 2 * * 1-5" ]; then
            echo "market=jp" >> "$GITHUB_OUTPUT"
            echo "extra_args=--midday" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "43 6 * * 1-5" ]; then
            echo "market=jp" >> "$GITHUB_OUTPUT"
            echo "extra_args=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 21 * * 0,6" ]; then
            echo "market=crypto" >> "$GITHUB_OUTPUT"
            echo "extra_args=" >> "$GITHUB_OUTPUT"
          else
            echo "market=us" >> "$GITHUB_OUTPUT"
            echo "extra_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run check
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python rsi_alert.py --market ${{ steps.market.outputs.market }} ${{ steps.market.outputs.extra_args }}
